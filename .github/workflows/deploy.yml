name: Publier Forge (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Non-régression visuelle : la version précédente sert de référence, rendue sur la
  # même machine que la nouvelle (mêmes polices, même GPU logiciel), puis les 80 images
  # sont comparées. Un changement voulu de l'image passe avec [visuel] dans le message de commit.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Références = version précédente
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            git worktree add ../prev HEAD~1
            (cd ../prev && npm ci --no-audit --no-fund)
            FORGE_ROOT=../prev VISUAL_BASELINE=$RUNNER_TEMP/base node tests/visual/run.cjs --update || echo "Version précédente non rendable : comparaison ignorée"
          fi
      - name: Comparaison image par image
        if: ${{ !contains(github.event.head_commit.message, '[visuel]') }}
        run: |
          if [ -d "$RUNNER_TEMP/base" ]; then VISUAL_BASELINE=$RUNNER_TEMP/base node tests/visual/run.cjs; else echo "Pas de références"; fi
      - name: Images différentes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: images-differentes
          path: tests/visual/out/
  # Vérifications sur Windows et Linux : vérification des types, tests unitaires, construction,
  # puis tests de bout en bout dans Chromium (studio et orchestrateur). Un échec bloque la mise en ligne.
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Tests unitaires
        run: npm test
      - name: Construction
        run: npm run build
      - name: Références du build (manifeste, imports dynamiques, chemins relatifs)
        run: node scripts/check-build.mjs dist
      - name: Navigateur de test
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Tests de bout en bout
        run: |
          npx vite --port 5199 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://localhost:5199/ && break; sleep 2; done
          node tests/e2e/studio.e2e.cjs
          node tests/e2e/orchestrator.e2e.cjs
          node tests/e2e/delivery.e2e.cjs
          node tests/e2e/storyboard.e2e.cjs
          node tests/e2e/library.e2e.cjs
          node tests/e2e/finish.e2e.cjs
          node tests/e2e/update.e2e.cjs
      - name: Journal du serveur
        if: failure()
        run: tail -n 80 vite.log || true
  build:
    needs: [visual, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (une erreur bloque la mise en ligne)
        run: npm test
      - run: npm run build
      - name: Garder les fichiers des publications précédentes (30 jours)
        # un onglet ouvert avant cette publication, ou un index.html encore en cache (10 min sur GitHub Pages),
        # demande les fichiers de SA version : ils doivent rester disponibles
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ../site-precedent || mkdir -p ../site-precedent
          node scripts/keep-old-assets.mjs dist ../site-precedent 30
          node scripts/check-build.mjs dist
      - name: Publier dist/ sur la branche gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
  # Après la mise en ligne : le site réellement servi sous /forge-studio/ est cohérent
  # (la bonne version, chaque fichier référencé présent, les fichiers gardés accessibles).
  verify-live:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attendre la publication par GitHub Pages
        run: |
          want="${GITHUB_SHA::12}"
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          for i in $(seq 1 60); do
            got=$(curl -s -H 'Cache-Control: no-cache' "${url}version.json?t=$(date +%s)" | sed -n 's/.*"build":"\([^"]*\)".*/\1/p')
            [ "$got" = "$want" ] && { echo "Version $got en ligne"; exit 0; }
            sleep 20
          done
          echo "La version $want n'est pas apparue en ligne (dernière vue : $got)"; exit 1
      - name: Vérifier le site publié
        run: node scripts/check-build.mjs "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
