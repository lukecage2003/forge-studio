name: Publier Forge (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Non-régression visuelle : la version précédente sert de référence, rendue sur la
  # même machine que la nouvelle (mêmes polices, même GPU logiciel), puis les 80 images
  # sont comparées. Un changement voulu de l'image passe avec [visuel] dans le message de commit.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Références = version précédente
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            git worktree add ../prev HEAD~1
            (cd ../prev && npm ci --no-audit --no-fund)
            FORGE_ROOT=../prev VISUAL_BASELINE=$RUNNER_TEMP/base node tests/visual/run.cjs --update || echo "Version précédente non rendable : comparaison ignorée"
          fi
      - name: Comparaison image par image
        if: ${{ !contains(github.event.head_commit.message, '[visuel]') }}
        run: |
          if [ -d "$RUNNER_TEMP/base" ]; then VISUAL_BASELINE=$RUNNER_TEMP/base node tests/visual/run.cjs; else echo "Pas de références"; fi
      - name: Images différentes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: images-differentes
          path: tests/visual/out/
  build:
    needs: visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (une erreur bloque la mise en ligne)
        run: npm test
      - run: npm run build
      - name: Publier dist/ sur la branche gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
